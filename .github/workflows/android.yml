name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-analyzer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  smoke-test:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Each line runs as a separate sh -c command, so no multi-line
          # constructs here. pidof fails the job if the process died; the
          # inverted grep fails it if logcat recorded a fatal exception.
          script: |
            adb logcat -c || true
            ./gradlew installDebug
            adb shell am start -W -n com.tenan.batteryanalyzer/.MainActivity
            sleep 20
            adb exec-out screencap -p > launch-screenshot.png
            adb shell monkey -p com.tenan.batteryanalyzer --pct-syskeys 0 --throttle 120 -v 250
            sleep 5
            adb exec-out screencap -p > after-interaction.png
            adb logcat -d > logcat.txt
            adb shell pidof com.tenan.batteryanalyzer
            grep -A 40 "FATAL EXCEPTION" logcat.txt || true
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence
          path: |
            logcat.txt
            launch-screenshot.png
            after-interaction.png
