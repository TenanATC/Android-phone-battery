name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            equalizer/build/reports/tests/testDebugUnitTest

      - name: Upload Battery Analyzer APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-analyzer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Studio EQ APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-eq-debug-apk
          path: equalizer/build/outputs/apk/debug/equalizer-debug.apk

  smoke-test:
    name: Launch ${{ matrix.module }} on emulator
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            package: com.tenan.batteryanalyzer
            emulator_options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
            # No extra checks for the battery app.
            extra1: "true"
            extra2: "true"
            extra3: "true"
          - module: equalizer
            package: com.tenan.equalizer
            # With -noaudio the audio server has no output, and every audio
            # effect (even the platform Equalizer) fails with NO_INIT.
            emulator_options: "-no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim"
            # Simulate Spotify announcing its audio session and pressing its
            # Equalizer button (targeted at this app explicitly: the
            # emulator's built-in MusicFX otherwise wins the implicit
            # intent), then switch the EQ on and require the engine to run.
            extra1: "adb shell am broadcast -a android.media.action.OPEN_AUDIO_EFFECT_CONTROL_SESSION --ei android.media.extra.AUDIO_SESSION 4242 --es android.media.extra.PACKAGE_NAME com.spotify.music"
            extra2: "adb shell am start -W -n com.tenan.equalizer/.MainActivity -a android.media.action.DISPLAY_AUDIO_EFFECT_CONTROL_PANEL --ei android.media.extra.AUDIO_SESSION 4242 --es android.media.extra.PACKAGE_NAME com.spotify.music"
            extra3: "python3 .github/scripts/eq_smoke.py"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: ${{ matrix.emulator_options }}
          # Each line runs as a separate sh -c command, so no multi-line
          # constructs here. pidof fails the job if the process died; the
          # inverted grep fails it if logcat recorded a fatal exception.
          script: |
            adb logcat -c || true
            ./gradlew :${{ matrix.module }}:installDebug
            adb shell am start -W -n ${{ matrix.package }}/.MainActivity
            sleep 20
            adb exec-out screencap -p > launch-screenshot.png
            ${{ matrix.extra1 }}
            ${{ matrix.extra2 }}
            ${{ matrix.extra3 }}
            adb exec-out screencap -p > after-intents.png
            adb shell monkey -p ${{ matrix.package }} --pct-syskeys 0 --throttle 120 -v 250
            sleep 5
            adb exec-out screencap -p > after-interaction.png
            adb logcat -d > logcat.txt
            adb shell pidof ${{ matrix.package }}
            grep -A 40 "FATAL EXCEPTION" logcat.txt || true
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence-${{ matrix.module }}
          path: |
            logcat.txt
            launch-screenshot.png
            after-intents.png
            after-interaction.png
